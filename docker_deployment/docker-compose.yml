networks:
  bigdata-net:
    name: bigdata-net

x-airflow: &airflow
  env_file:
    - ./airflow.env
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow_webserver:8080/execution/
    - _PIP_ADDITIONAL_REQUIREMENTS=apache-airflow-providers-docker apache-airflow-providers-fab
    - _AIRFLOW_DB_MIGRATE=true
    - _AIRFLOW_WWW_USER_CREATE=true

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks: [bigdata-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - zookeeper_data_vol:/var/lib/zookeeper/data
      - zookeeper_log_vol:/var/lib/zookeeper/log
    mem_limit: 256m
    cpus: 0.3

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks: [bigdata-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - kafka_data_vol:/var/lib/kafka/data
    mem_limit: 1g
    cpus: 0.8
    
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    networks: [bigdata-net]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false 
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9200:9200"
    volumes:
      - es_data_vol:/usr/share/elasticsearch/data
    mem_limit: 4g
    cpus: 1.5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    networks: [bigdata-net]
    depends_on: [elasticsearch]
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    mem_limit: 768m
    cpus: 0.5

  speed_layer:
    build: ../speed
    container_name: spark_speed_layer
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks: [bigdata-net]
    restart: always
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=weather_data
      - ES_HOST=elasticsearch  
    volumes:
      - spark_checkpoints_vol:/app/spark_checkpoints
    mem_limit: 3g
    cpus: 2.0

  batch_layer:
    build: 
      context: ../batch
      dockerfile: Dockerfile.batch
    container_name: spark_batch_layer
    depends_on:
      elasticsearch:
        condition: service_started
    networks: [bigdata-net]
    restart: no 
    env_file:
      - ./spark.env
    volumes:
      - ${HOME}/.ivy2:/root/.ivy2
    mem_limit: 3g
    cpus: 2.0

  kafka_connect:
    build:
      context: ../batch
      dockerfile: Dockerfile.kafkaconnect 
    container_name: kafka_connect
    depends_on:
      kafka:
        condition: service_healthy
    networks: [bigdata-net]
    ports:
      - "8083:8083"
    env_file:
      - ./kafka_connect.env
    environment:
      - KAFKA_HEAP_OPTS=-Xms512m -Xmx1g
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0

  kafka_connect_init:
    image: curlimages/curl:8.10.1
    container_name: kafka_connect_init
    depends_on:
      - kafka_connect
    networks: [bigdata-net]
    volumes:
      - ../batch/config.json:/connectors/config.json:ro
      - ../batch/config_forecast.json:/connectors/config_forecast.json:ro
      - ../batch/config_pollution.json:/connectors/config_pollution.json:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        echo "Waiting for Kafka Connect REST API..."
        until curl -fsS http://kafka_connect:8083/ >/dev/null; do
          sleep 5
        done
        echo "Registering Kafka Connect S3 sink connectors..."
        curl -fsS -X PUT http://kafka_connect:8083/connectors/s3-sink-weather-realtime/config \
          -H "Content-Type: application/json" \
          --data-binary @/connectors/config.json
        echo
        curl -fsS -X PUT http://kafka_connect:8083/connectors/s3-sink-weather-forecast/config \
          -H "Content-Type: application/json" \
          --data-binary @/connectors/config_forecast.json
        echo
        curl -fsS -X PUT http://kafka_connect:8083/connectors/s3-sink-pollution/config \
          -H "Content-Type: application/json" \
          --data-binary @/connectors/config_pollution.json
        echo
        echo "Kafka Connect connectors registered."
    restart: "no"
    mem_limit: 128m
    cpus: 0.1

  serving_api:
    build: ../serving
    container_name: serving_api
    depends_on:
      elasticsearch:
        condition: service_started
    networks: [bigdata-net]
    restart: always
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX=weather_realtime
    ports:
      - "8000:8000"
    mem_limit: 256m
    cpus: 0.5

  airflow-db:
    image: postgres:13-alpine
    container_name: airflow_db
    networks: [bigdata-net]
    env_file:
      - ./airflow.env
    environment:
      - POSTGRES_DB=airflow
    mem_limit: 512m
    cpus: 0.4

  airflow-init:
    <<: *airflow
    image: apache/airflow:3.2.1-python3.10
    container_name: airflow_init
    networks: [bigdata-net]
    depends_on:
      - airflow-db
    command: version

  airflow-webserver:
    <<: *airflow
    image: apache/airflow:3.2.1-python3.10
    container_name: airflow_webserver
    restart: always
    networks: [bigdata-net]
    depends_on:
      - airflow-init
    volumes:
      - ../airflow/docker/dags:/opt/airflow/dags
      - ../airflow/docker/logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: api-server
    mem_limit: 768m
    cpus: 0.6

  airflow-scheduler:
    <<: *airflow
    image: apache/airflow:3.2.1-python3.10
    user: "1001:0"
    group_add: 
      - "109"
    container_name: airflow_scheduler
    restart: always
    networks: [bigdata-net]
    depends_on:
      - airflow-init
    volumes:
      - ../airflow/docker/dags:/opt/airflow/dags
      - ../airflow/docker/logs:/opt/airflow/logs
      - ../crawler:/opt/airflow/crawler
      - /var/run/docker.sock:/var/run/docker.sock
      - crawler_state_vol:/opt/airflow/crawler_state
    command: scheduler
    mem_limit: 1.5g
    cpus: 0.6

  airflow-dag-processor:
    <<: *airflow
    image: apache/airflow:3.2.1-python3.10
    user: "1001:0"
    group_add: 
      - "109"
    container_name: airflow_dag_processor
    restart: always
    networks: [bigdata-net]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ../airflow/docker/dags:/opt/airflow/dags
      - ../airflow/docker/logs:/opt/airflow/logs
      - ../crawler:/opt/airflow/crawler
      - /var/run/docker.sock:/var/run/docker.sock
    command: dag-processor
    mem_limit: 512m
    cpus: 0.4

  airflow-triggerer:
    <<: *airflow
    image: apache/airflow:3.2.1-python3.10
    user: "1001:0"
    group_add: 
      - "109"
    container_name: airflow_triggerer
    restart: always
    networks: [bigdata-net]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ../airflow/docker/dags:/opt/airflow/dags
      - ../airflow/docker/logs:/opt/airflow/logs
      - ../crawler:/opt/airflow/crawler
      - /var/run/docker.sock:/var/run/docker.sock
    command: triggerer
    mem_limit: 256m
    cpus: 0.4

volumes:
  crawler_state_vol:
    name: crawler_state_vol
  spark_checkpoints_vol:
    name: spark_checkpoints_vol
  es_data_vol:
    name: es_data_vol
  kafka_data_vol:
    name: kafka_data_vol
  zookeeper_data_vol:
    name: zookeeper_data_vol
  zookeeper_log_vol:
    name: zookeeper_log_vol
