networks:
  bigdata-net:
    name: bigdata-net

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks: [bigdata-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    mem_limit: 256m
    cpus: 0.3
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks: [bigdata-net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    mem_limit: 1g
    cpus: 0.8
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    networks: [bigdata-net]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false 
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9200:9200"
    mem_limit: 4g

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    networks: [bigdata-net]
    depends_on: [elasticsearch]
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    mem_limit: 1g

  speed_layer:
    build: ../speed
    container_name: spark_speed_layer
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks: [bigdata-net]
    restart: always
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=weather_data
      - ES_HOST=elasticsearch  

  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: minio
    networks: [bigdata-net]
    ports:
      - "9000:9000" 
      - "9001:9001" 
    env_file:
      - ./minio.env
    command: server /data --console-address ":9001"

  minio_init:
    image: minio/mc
    container_name: minio_init
    networks: [bigdata-net]
    depends_on:
      - minio
    entrypoint: 
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 admin password123;
      mc mb myminio/raw-weather-data || true;
      mc anonymous set public myminio/raw-weather-data;
      exit 0;
      "

  batch_layer:
    build: 
      context: ../batch
      dockerfile: Dockerfile.batch
    container_name: spark_batch_layer
    depends_on:
      elasticsearch:
        condition: service_started
    networks: [bigdata-net]
    restart: no 
    env_file:
      - ./minio.env

  kafka_connect:
    build:
      context: ../batch
      dockerfile: Dockerfile.kafkaconnect 
    container_name: kafka_connect
    depends_on:
      kafka:
        condition: service_healthy
    networks: [bigdata-net]
    ports:
      - "8083:8083"
    env_file:
      - ./kafka_connect.env

  serving_api:
    build: ../serving
    container_name: serving_api
    depends_on:
      elasticsearch:
        condition: service_started
    networks: [bigdata-net]
    restart: always
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX=weather_realtime
    ports:
      - "8000:8000"

  airflow-db:
    image: postgres:13-alpine
    container_name: airflow_db
    networks: [bigdata-net]
    env_file:
      - ./airflow.env
    mem_limit: 512m
    cpus: 0.4

  airflow-init:
    image: apache/airflow:3.2.1-python3.10
    container_name: airflow_init
    networks: [bigdata-net]
    depends_on:
      - airflow-db
    env_file:
      - ./airflow.env
    command: version

  airflow-webserver:
    image: apache/airflow:3.2.1-python3.10
    container_name: airflow_webserver
    restart: always
    networks: [bigdata-net]
    depends_on:
      - airflow-init
    env_file:
      - ./airflow.env
    volumes:
      - ../airflow/docker/dags:/opt/airflow/dags
      - ../airflow/docker/logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: api-server
    mem_limit: 768m
    cpus: 0.6

  airflow-scheduler:
    image: apache/airflow:3.2.1-python3.10
    # user: "1001:0"
    # group_add: 
    #   - "109"
    container_name: airflow_scheduler
    restart: always
    networks: [bigdata-net]
    depends_on:
      - airflow-init
    env_file:
      - ./airflow.env
    volumes:
      - ../airflow/docker/dags:/opt/airflow/dags
      - ../airflow/docker/logs:/opt/airflow/logs
      - ../crawler:/opt/airflow/crawler
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    mem_limit: 768m
    cpus: 0.6

  airflow-dag-processor:
    image: apache/airflow:3.2.1-python3.10
    # user: "1001:0"
    # group_add: 
    #   - "109"
    container_name: airflow_dag_processor
    restart: always
    networks: [bigdata-net]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - ./airflow.env
    volumes:
      - ../airflow/docker/dags:/opt/airflow/dags
      - ../airflow/docker/logs:/opt/airflow/logs
      - ../crawler:/opt/airflow/crawler
      - /var/run/docker.sock:/var/run/docker.sock
    command: dag-processor
    mem_limit: 512m
    cpus: 0.4

  airflow-triggerer:
    image: apache/airflow:3.2.1-python3.10
    # user: "1001:0"
    # group_add: 
    #   - "109"
    container_name: airflow_triggerer
    restart: always
    networks: [bigdata-net]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - ./airflow.env
    volumes:
      - ../airflow/docker/dags:/opt/airflow/dags
      - ../airflow/docker/logs:/opt/airflow/logs
      - ../crawler:/opt/airflow/crawler
      - /var/run/docker.sock:/var/run/docker.sock
    command: triggerer
    mem_limit: 512m
    cpus: 0.4
