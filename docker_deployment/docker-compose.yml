networks:
  bigdata-net:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks: [bigdata-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    mem_limit: 256m
    cpus: 0.3

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks: [bigdata-net]
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    mem_limit: 1g
    cpus: 0.8
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  weather_crawler:
    build: ../crawler
    container_name: weather_crawler
    command: python3 -u weather_crawler/weather_crawler.py
    depends_on:
      kafka:
        condition: service_healthy
    networks: [bigdata-net]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - ../crawler/.env

  pollution_crawler:
    build: ../crawler
    container_name: pollution_crawler
    command: python3 -u pollution_crawler/pollution_crawler.py
    depends_on:
      kafka:
        condition: service_healthy
    networks: [bigdata-net]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file:
      - ../crawler/.env
    

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: elasticsearch
    networks: [bigdata-net]
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false 
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    mem_limit: 1g

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: kibana
    networks: [bigdata-net]
    depends_on: [elasticsearch]
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    mem_limit: 1g

  speed_layer:
    build: ../speed
    container_name: spark_speed_layer
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_started
    networks: [bigdata-net]
    restart: always
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=weather_data
      - ES_HOST=elasticsearch  

  minio:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: minio
    networks: [bigdata-net]
    ports:
      - "9000:9000" 
      - "9001:9001" 
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"

  minio_init:
    image: minio/mc
    container_name: minio_init
    networks: [bigdata-net]
    depends_on:
      - minio
    entrypoint: 
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 admin password123;
      mc mb myminio/raw-weather-data || true;
      mc anonymous set public myminio/raw-weather-data;
      exit 0;
      "

  batch_layer:
    build: 
      context: ../batch
      dockerfile: Dockerfile.batch
    container_name: spark_batch_layer
    depends_on:
      elasticsearch:
        condition: service_started
    networks: [bigdata-net]
    restart: no 
    environment:
      - ES_HOST=elasticsearch
      - MINIO_ROOT_USER=admin     
      - MINIO_ROOT_PASSWORD=password123

  kafka_connect:
    build:
      context: ../batch
      dockerfile: Dockerfile.kafkaconnect 
    container_name: kafka_connect
    depends_on:
      kafka:
        condition: service_healthy
    networks: [bigdata-net]
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:9092'
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka_connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: compose-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: docker-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 10000
      CONNECT_OFFSET_STORAGE_TOPIC: docker-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: docker-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      AWS_ACCESS_KEY_ID: admin 
      AWS_SECRET_ACCESS_KEY: password123

  serving_api:
    build: ../serving
    container_name: serving_api
    depends_on:
      elasticsearch:
        condition: service_started
    networks: [bigdata-net]
    restart: always
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ES_INDEX=weather_realtime
    ports:
      - "8000:8000"
